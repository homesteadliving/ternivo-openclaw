    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: skills/ternivo-connect
      dry_run: true
