name: ClawHub Skill Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: skills/ternivo-connect
      dry_run: false
      tags: latest
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
