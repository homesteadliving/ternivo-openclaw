name: ClawHub Package Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  validate:
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.23.3
    with:
      dry_run: true
      family: bundle-plugin
